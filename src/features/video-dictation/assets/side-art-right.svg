<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" fill="none">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#7c3aed" fill-opacity="0.2"/>
    </pattern>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <!-- rings and a soft disc, top right -->
  <circle cx="330" cy="150" r="170" stroke="#7c3aed" stroke-opacity="0.13" stroke-width="2"/>
  <circle cx="330" cy="150" r="112" stroke="#7c3aed" stroke-opacity="0.11" stroke-width="2"/>
  <circle cx="330" cy="150" r="60" fill="url(#soft)"/>

  <!-- a field of dots -->
  <rect x="30" y="300" width="154" height="132" fill="url(#dots)"/>

  <!-- subtitles: three lines in a screen -->
  <rect x="70" y="500" width="230" height="140" rx="20" fill="#ffffff" fill-opacity="0.76" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="96" y="560" width="178" height="12" rx="6" fill="#2563eb" fill-opacity="0.3"/>
  <rect x="116" y="586" width="138" height="12" rx="6" fill="#2563eb" fill-opacity="0.22"/>
  <circle cx="108" cy="530" r="7" fill="#7c3aed" fill-opacity="0.35"/>
  <circle cx="132" cy="530" r="7" fill="#2563eb" fill-opacity="0.3"/>

  <!-- sound waves -->
  <g stroke="#2563eb" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round">
    <path d="M110 760 V800"/>
    <path d="M142 740 V820"/>
    <path d="M174 718 V842"/>
    <path d="M206 746 V814"/>
    <path d="M238 730 V830"/>
    <path d="M270 756 V804"/>
  </g>

  <!-- microphone-free "type it back" cursor -->
  <rect x="80" y="900" width="200" height="56" rx="16" fill="#ffffff" fill-opacity="0.76" stroke="#2563eb" stroke-opacity="0.24" stroke-width="2"/>
  <rect x="102" y="920" width="92" height="10" rx="5" fill="#2563eb" fill-opacity="0.3"/>
  <rect x="202" y="916" width="4" height="22" rx="2" fill="#7c3aed" fill-opacity="0.5"/>

  <!-- rings, bottom -->
  <circle cx="60" cy="1030" r="96" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="60" cy="1030" r="54" fill="url(#soft)"/>
</svg>
